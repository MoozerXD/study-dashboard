# Reverse proxy for Study Dashboard.
# Copy to /etc/nginx/sites-available/study-dashboard, replace your-domain.com,
# then: ln -s ../sites-available/study-dashboard /etc/nginx/sites-enabled/
#
# Run certbot afterwards — it rewrites this file to add the TLS listener and
# the HTTP→HTTPS redirect.

server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com www.your-domain.com;

  # AI chat attachments are accepted up to 48 MB by the app; nginx defaults to
  # 1 MB and would reject them with 413 before the request ever arrives.
  client_max_body_size 50m;

  # Static assets are fingerprinted with ?v= query strings, so they can be
  # cached hard; HTML and the API must never be cached by the proxy.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Required: the app trusts this header to rate-limit per visitor.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Grading an essay with the AI provider can take well over a minute.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
}
